[package]
name = "identity-service"
version = "0.2.0"
edition = "2021"
rust-version = "1.99"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["macros", "form"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
rskafka = { version = "0.6", features = ["transport-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "migrate", "json"] }
argon2 = "0.5"
jsonwebtoken = "9.3"
aes-gcm = "0.10"
subtle = "2.6"
totp-rs = { version = "5.6", features = ["gen_secret", "otpauth"] }
ring = "0.17"
pem = "3"
pkcs1 = { version = "0.7", features = ["std"] }
spki = { version = "0.7", features = ["std"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.13", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.28"
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["http-proto", "reqwest-client"] }
prometheus = "0.13"
thiserror = "2.0"
anyhow = "1.0"
dotenvy = "0.15"
platform-contracts = { path = "../platform-contracts/rust" }
